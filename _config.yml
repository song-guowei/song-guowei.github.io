# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

title: Guowei Song
description: >- # this means to ignore newlines until "baseurl:"
  Guowei Song | Agricultural and Development Economics
baseurl: "" # the subpath of the site
url: "https://song-guowei.github.io" # the base hostname & protocol for the site
twitter_username: 
github_username: song-guowei
favicon: "/favicon.ico"

# Build settings
remote_theme: eliottvincent/bay
plugins:
  - jekyll-feed

header:
  pages:
    - name: Home
      slug: /
    - name: Research
      slug: /research
    - name: CV
      slug: /cv
    - name: Beyond
      slug: /beyond

footer:
  show_powered_by: true
  contact:
    - name: Email
      value: gwsong2026@gmail.com
      link: mailto:gwsong2026@gmail.com
    - name: Address
      value: Beijing, China
  follow:
    - name: LinkedIn
      link: https://www.linkedin.com/in/your-linkedin-username
    - name: GitHub
      link: https://github.com/song-guowei
    - name: Scholar
      link: https://scholar.google.com/citations?user=YOUR_SCHOLAR_ID

# Build settings
markdown: kramdown
sass:
    style: :compressed
plugins:
  - jekyll-feed

# Excluded items
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - feed.xml
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Used for defeating caching
version: 1
